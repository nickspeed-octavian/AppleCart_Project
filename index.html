<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AppleCart</title>
    <link rel="stylesheet" href="/src/scss/style.scss"> <!-- Used for development -->
    <!-- Link to Font Awesome icons -->
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header__content">
            <h1 class="header__title">AppleCart</h1>
            <div class="header__checkout">
                <a href="#" class="header__checkout-link">
                    <i class="fas fa-shopping-cart"></i>
                    <span class="header__checkout-count">0</span>
                </a>
            </div>
            <!-- Mini-basket preview -->
            <div class="header__cart-preview">
                <ul class="header__cart-items">
                    <!-- Cart items will be dynamically added here using js -->
                </ul>
                <p class="header__cart-total">Total: $0.00 <span class="header__cart-total-amount"></span></p>
                <button class="header__clear-cart-button"><i class="fas fa-trash"></i>Clear Basket</button>
                <a href="#" class="header__view-cart-button"><i class="fas fa-shopping-cart"></i>View Cart</a>
            </div>
        </div>
    </header>

    <!-- Store Section -->
     <main class="store">
        <section class="store__product-list">

        </section>
     </main>

     <!-- Footer -->
      <footer class="footer">
        <p>&copy; <span id="year"></span> Apple Store. All rights reserved</p>
      </footer>

      <!-- Javascript Files -->
       <script type="module" src="/src/data/products.js"></script>
       <script type="module" src="/src/js/script.js"></script>
       <script>
            document.addEventListener("DOMContentLoaded",function() {
                const yearSpan=document.getElementById("year");
                yearSpan.textContent = new Date().getFullYear();
            });
       </script>
       <div class="toast-container"></div>

</body>
</html>
